<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Resultater | Quiz-App</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/quiz-results.css">
</head>
<body>
    <header>
        <nav>
            <a href="/index.html" class="logo">QuizApp</a>
            <ul>
                <li><a href="/teacher/dashboard.html">Dashboard</a></li>
                <li><span id="welcomeMessage">Velkommen, Lærer</span></li>
                <li><a href="#" id="logoutBtn">Logg ut</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <div class="results-header">
            <h1 id="quizTitle">Laster resultater...</h1>
            <button id="backBtn" class="btn secondary">Tilbake til dashboard</button>
        </div>
        
        <div class="results-summary">
            <div class="summary-card">
                <h3>Totalt antall besvarelser</h3>
                <div class="summary-value" id="totalSubmissions">0</div>
            </div>
            <div class="summary-card">
                <h3>Gjennomsnittlig poengsum</h3>
                <div class="summary-value" id="averageScore">0%</div>
            </div>
            <div class="summary-card">
                <h3>Høyeste poengsum</h3>
                <div class="summary-value" id="highestScore">0%</div>
            </div>
        </div>
        
        <div class="results-content">
            <div class="submissions-section">
                <h2>Elevbesvarelser</h2>
                <div id="submissionsList" class="submissions-list">
                    <p class="empty-state">Ingen besvarelser for denne quizen ennå.</p>
                </div>
            </div>
            
            <div class="questions-stats-section">
                <h2>Spørsmålsstatistikk</h2>
                <div id="questionsStats" class="questions-stats">
                    <p class="empty-state">Ingen data å vise ennå.</p>
                </div>
            </div>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2025 Quiz-App</p>
    </footer>
    
    <script src="/js/auth.js"></script>
    <script src="/js/quiz-results.js"></script>
</body>
</html>
