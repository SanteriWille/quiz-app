<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultatdetaljer | Quiz-App</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/result-details.css">
</head>
<body>
    <header>
        <nav>
            <a href="/index.html" class="logo">QuizApp</a>
            <ul>
                <li><a href="/student/dashboard.html">Dashboard</a></li>
                <li><span id="welcomeMessage">Velkommen, Elev</span></li>
                <li><a href="#" id="logoutBtn">Logg ut</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <div class="result-container">
            <div class="result-header">
                <h1 id="quizTitle">Laster resultat...</h1>
                <button id="backBtn" class="btn secondary">Tilbake til dashboard</button>
            </div>
            
            <div class="result-summary">
                <div class="result-score">
                    <div class="score-circle">
                        <span id="scorePercentage">0%</span>
                    </div>
                    <p><span id="scoreValue">0</span> av <span id="totalQuestions">0</span> riktige svar</p>
                </div>
                
                <div class="result-info">
                    <p><strong>Fullført:</strong> <span id="completionDate">-</span></p>
                </div>
            </div>
            
            <div class="result-details">
                <h2>Detaljert oversikt</h2>
                <div id="questionsList" class="questions-list">
                    <!-- Spørsmål og svar vil bli lagt til her -->
                </div>
            </div>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2025 Quiz-App</p>
    </footer>
    
    <script src="/js/auth.js"></script>
    <script src="/js/result-details.js"></script>
</body>
</html>
